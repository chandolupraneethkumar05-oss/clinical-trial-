name: Controlled Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic release version tag (e.g. v1.2.0 or v1.2.0-rc.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Validate Release, Run Verification & Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Determine and validate SemVer tag and branch lineage
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_VERSION"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid release tag '$TAG'. Expected SemVer format such as v1.0.0 or v1.0.0-rc.1."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::Release commit must be an ancestor of origin/master."
            exit 1
          fi
          IS_PRE="false"
          if echo "$TAG" | grep -q -- '-'; then
            IS_PRE="true"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$IS_PRE" >> "$GITHUB_OUTPUT"

      - name: Set up Python and Node.js
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Verify full backend tests & frontend build before release
        env:
          ENVIRONMENT: test
          DB_PATH: ${{ runner.temp }}/protocolshield_release.duckdb
        run: |
          pip install -r backend/requirements.txt
          JWT_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export JWT_SECRET_KEY
          pytest backend/tests -v
          npm --prefix frontend ci
          (cd frontend && npx tsc -b --noEmit)
          npm --prefix frontend run lint
          npm --prefix frontend test
          npm --prefix frontend run build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626b6b0e65 # v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ProtocolShield ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
