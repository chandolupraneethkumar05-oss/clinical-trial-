name: Security Scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-security:
    name: Python Dependencies & Bandit SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install security scanners
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: Scan Python dependencies for known vulnerabilities (pip-audit)
        run: |
          mkdir -p security-reports
          pip-audit -r backend/requirements.txt --format json --output security-reports/pip-audit.json || PIP_AUDIT_EXIT=$?
          pip-audit -r backend/requirements.txt
          exit "${PIP_AUDIT_EXIT:-0}"

      - name: Run Bandit SAST on backend/app
        run: |
          mkdir -p security-reports
          bandit -r backend/app -ll -ii -f json -o security-reports/bandit.json || BANDIT_EXIT=$?
          bandit -r backend/app -ll -ii
          exit "${BANDIT_EXIT:-0}"

      - name: Upload Python security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-security-reports
          path: security-reports/
          if-no-files-found: warn

  frontend-security:
    name: Frontend Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and audit production graph
        run: |
          npm ci --ignore-scripts
          mkdir -p ../security-reports
          npm audit --json > ../security-reports/npm-audit.json || true
          npm audit --omit=dev --audit-level=high

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-security-report
          path: security-reports/npm-audit.json
          if-no-files-found: warn

  secret-scan:
    name: Secret & Credential Hygiene Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Ensure no .env or private key files are committed
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.local)|\.(pem|key|duckdb)$'; then
            echo "::error::Sensitive or local database file detected in tracked git index."
            exit 1
          fi
          echo "Tracked git index free of .env, key, and DuckDB files."

      - name: Run TruffleHog OSS secret scan
        uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          path: ./
          extra_args: --only-verified

  dependency-review:
    name: Pull Request Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run GitHub Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
